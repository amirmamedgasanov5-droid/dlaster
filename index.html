<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ultrasound LaserTag Duel</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #08080c; color: #fff; }

    .gun-interface {
      position: absolute; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 20px; background: radial-gradient(circle at center, #151520 0%, #050508 100%);
    }

    .btn-fire-left {
      position: absolute; top: 15px; left: 15px;
      background: linear-gradient(135deg, #ff0044, #990022);
      color: #fff; font-size: 22px; font-weight: bold;
      padding: 22px 35px; border-radius: 16px;
      border: 2px solid #fff; box-shadow: 0 0 20px rgba(255, 0, 68, 0.8);
      cursor: pointer;
    }
    .btn-fire-left:active { transform: scale(0.92); background: #ff3366; }

    .role-badge {
      position: absolute; top: 15px; right: 15px;
      font-size: 11px; color: #00ff42; letter-spacing: 1px;
      border: 1px solid #00ff42; padding: 6px 10px; border-radius: 6px;
      background: rgba(0,255,66,0.1); font-weight: bold; text-align: right;
    }

    .panel-bottom {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(20, 20, 30, 0.95); padding: 18px; border-radius: 16px;
      text-align: center; width: 90%; max-width: 340px; border: 1px solid #333;
    }

    input { 
      width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: none; 
      text-align: center; font-size: 22px; font-weight: bold; background: #111; color: #00ff42; 
      letter-spacing: 4px;
    }
    button.btn-connect { 
      background: #00ff42; color: #000; font-weight: bold; padding: 14px; border: none; 
      border-radius: 10px; width: 100%; font-size: 18px; cursor: pointer; 
    }

    .game-screen {
      position: absolute; z-index: 100; width: 100%; height: 100%;
      display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center;
      padding: 20px;
    }
    #dead-screen { background: #c80000; }
    #win-screen { background: #008822; }
    .game-screen h1 { font-size: 42px; text-shadow: 0 0 10px #000; }
    .game-screen p { margin-top: 10px; font-size: 18px; }
    .btn-respawn { margin-top:30px; padding: 14px 32px; background:#fff; color:#000; font-size: 18px; font-weight:bold; border-radius:10px; border:none; cursor:pointer; }
  </style>
</head>
<body>

  <div class="gun-interface">
    <button class="btn-fire-left" onclick="shoot()">💥 ОГОНЬ</button>
    <div class="role-badge" id="role-info">РЕЖИМ: НЕ ПОДКЛЮЧЕНО</div>

    <div class="panel-bottom" id="setup-panel">
      <div style="font-size: 14px; color: #aaa;">Твой код: <b id="my-id" style="color:#00ff42; font-size: 24px;">....</b></div>
      <input type="number" id="target-id" placeholder="1234" pattern="[0-9]*" inputmode="numeric">
      <button class="btn-connect" onclick="connectToBrother()">ПОДКЛЮЧИТЬСЯ</button>
      <div id="status" style="margin-top:8px; font-size:12px; color:#888;">Введи 4 цифры брата</div>
    </div>
  </div>

  <!-- Экран Поражения -->
  <div id="dead-screen" class="game-screen">
    <h1>ТЫ УБИТ! ☠️</h1>
    <p>Брат оказался быстрее и попал в тебя!</p>
    <button class="btn-respawn" onclick="respawn()">СЛЕДУЮЩИЙ РАУНД</button>
  </div>

  <!-- Экран Победы -->
  <div id="win-screen" class="game-screen">
    <h1>ТЫ ПОБЕДИЛ! 🏆</h1>
    <p>Отличный выстрел! Ты накрыл брата первым!</p>
    <button class="btn-respawn" onclick="respawn()">СЛЕДУЮЩИЙ РАУНД</button>
  </div>

  <script>
    const myFourDigits = Math.floor(1000 + Math.random() * 9000).toString();
    const peer = new Peer('lt-game-' + myFourDigits);

    let conn = null;
    let audioCtx = null;
    let analyser = null;

    let myTXFreq = 18000; 
    let myRXFreq = 19000;
    let isMutedSelf = false;
    let isRoundOver = false;
    let hitCounter = 0;

    document.getElementById('my-id').innerText = myFourDigits;

    peer.on('connection', c => {
      conn = c;
      myTXFreq = 18000;
      myRXFreq = 19000;
      updateRoleUI("ИГРОК 1 (18кГц)");
      setupConnection();
    });

    async function connectToBrother() {
      await initAudio();
      const targetDigit = document.getElementById('target-id').value.trim();
      if (!targetDigit || targetDigit.length !== 4) return alert('Введи ровно 4 цифры!');
      
      document.getElementById('status').innerText = 'Соединение...';
      conn = peer.connect('lt-game-' + targetDigit);
      myTXFreq = 19000;
      myRXFreq = 18000;
      updateRoleUI("ИГРОК 2 (19кГц)");
      setupConnection();
    }

    function updateRoleUI(text) {
      document.getElementById('role-info').innerText = "РЕЖИМ: " + text;
    }

    function setupConnection() {
      if (!conn) return;

      conn.on('open', () => {
        document.getElementById('status').innerText = '✅ ПОДКЛЮЧЕНО К БРАТУ!';
        document.getElementById('status').style.color = '#00ff42';
        initAudio();
      });

      conn.on('data', data => {
        if (data.type === 'I_DIED') {
          // Брат сообщил, что мы его убили
          if (!isRoundOver) {
            win();
          }
        } else if (data.type === 'RESET') {
          hideScreens();
        }
      });

      conn.on('error', () => {
        document.getElementById('status').innerText = '❌ Ошибка подключения';
        document.getElementById('status').style.color = '#ff0044';
      });
    }

    async function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      if (!analyser) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } });
          const source = audioCtx.createMediaStreamSource(stream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          source.connect(analyser);

          listenUltrasound();
        } catch (err) {
          console.error(err);
        }
      }
    }

    function listenUltrasound() {
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function check() {
        if (!isMutedSelf && !isRoundOver && analyser) {
          analyser.getByteFrequencyData(dataArray);
          
          const targetIndex = Math.round((myRXFreq / (audioCtx.sampleRate / 2)) * bufferLength);
          
          const val1 = dataArray[targetIndex - 1] || 0;
          const val2 = dataArray[targetIndex] || 0;
          const val3 = dataArray[targetIndex + 1] || 0;
          const maxSignal = Math.max(val1, val2, val3);

          const lowFreqSum = dataArray[2] + dataArray[3] + dataArray[4]; 

          if (maxSignal > 85 && lowFreqSum < 200) {
            hitCounter++;
            if (hitCounter >= 2) {
              hitCounter = 0;
              // Мы улавливаем выстрел брата -> МЫ УМИРАЕМ ПЕРВЫМИ
              die();
            }
          } else {
            hitCounter = 0;
          }
        }
        requestAnimationFrame(check);
      }
      check();
    }

    async function shoot() {
      if (isRoundOver) return;
      await initAudio();
      
      isMutedSelf = true;
      setTimeout(() => { isMutedSelf = false; }, 400);

      playShotSound();
      if (navigator.vibrate) navigator.vibrate(80);

      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(myTXFreq, audioCtx.currentTime);

        gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch(e) {}
    }

    function die() {
      if (isRoundOver) return;
      isRoundOver = true;

      // Уведомляем брата, что он попал и победил
      if (conn && conn.open) {
        conn.send({ type: 'I_DIED' });
      }

      if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 500]);
      playExplosionSound();
      document.getElementById('dead-screen').style.display = 'flex';
    }

    function win() {
      if (isRoundOver) return;
      isRoundOver = true;

      if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
      playWinSound();
      document.getElementById('win-screen').style.display = 'flex';
    }

    function respawn() {
      hideScreens();
      if (conn && conn.open) {
        conn.send({ type: 'RESET' });
      }
    }

    function hideScreens() {
      isRoundOver = false;
      document.getElementById('dead-screen').style.display = 'none';
      document.getElementById('win-screen').style.display = 'none';
    }

    function playShotSound() {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch(e) {}
    }

    function playExplosionSound() {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch(e) {}
    }

    function playWinSound() {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch(e) {}
    }
  </script>
</body>
</html>
