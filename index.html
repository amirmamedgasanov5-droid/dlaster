<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ultrasound LaserTag Pro</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #08080c; color: #fff; }

    .app-container {
      position: absolute; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 20px; background: radial-gradient(circle at center, #181824 0%, #050508 100%);
    }

    /* Верхняя панель со счетом */
    .header-score {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px; border-radius: 16px; backdrop-filter: blur(10px);
    }
    .score-box { text-align: center; }
    .score-title { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .score-val { font-size: 28px; font-weight: 900; color: #00ff42; text-shadow: 0 0 10px rgba(0,255,66,0.5); }
    .vs-badge { font-size: 14px; font-weight: bold; color: #ff0044; }

    /* Кнопка огня */
    .fire-zone {
      display: flex; justify-content: center; align-items: center; flex: 1; margin: 20px 0;
    }
    .btn-fire {
      width: 100%; max-width: 300px; height: 180px;
      background: linear-gradient(135deg, #ff0044, #990022);
      color: #fff; font-size: 32px; font-weight: 900; letter-spacing: 2px;
      border-radius: 28px; border: 3px solid #ff4477;
      box-shadow: 0 0 30px rgba(255, 0, 68, 0.6);
      cursor: pointer; transition: transform 0.05s ease;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .btn-fire:active { transform: scale(0.94); background: #ff2255; }
    .btn-fire span { font-size: 13px; font-weight: normal; opacity: 0.8; margin-top: 6px; }

    /* Нижняя панель настройки */
    .panel-bottom {
      background: rgba(20, 20, 30, 0.95); padding: 18px; border-radius: 20px;
      text-align: center; border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .target-select {
      display: flex; justify-content: center; gap: 8px; margin: 10px 0;
    }
    .target-btn {
      flex: 1; padding: 8px; background: #111; border: 1px solid #333; color: #888;
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px;
    }
    .target-btn.active { background: #00ff42; color: #000; border-color: #00ff42; }

    input { 
      width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: none; 
      text-align: center; font-size: 20px; font-weight: bold; background: #111; color: #00ff42; 
      letter-spacing: 4px;
    }
    button.btn-connect { 
      background: #00ff42; color: #000; font-weight: bold; padding: 14px; border: none; 
      border-radius: 10px; width: 100%; font-size: 16px; cursor: pointer; 
    }

    /* Экраны результатов */
    .game-screen {
      position: absolute; z-index: 100; top: 0; left: 0; width: 100%; height: 100%;
      display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center;
      padding: 20px; backdrop-filter: blur(15px);
    }
    #round-dead-screen { background: rgba(150, 0, 0, 0.92); }
    #round-win-screen { background: rgba(0, 120, 40, 0.92); }
    #match-end-screen { background: rgba(10, 10, 15, 0.96); }

    .game-screen h1 { font-size: 38px; font-weight: 900; text-shadow: 0 0 15px rgba(0,0,0,0.8); }
    .game-screen p { margin-top: 10px; font-size: 18px; opacity: 0.9; }
    .btn-action { margin-top: 25px; padding: 14px 32px; background: #fff; color: #000; font-size: 18px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header-score">
      <div class="score-box">
        <div class="score-title">ТЫ</div>
        <div class="score-val" id="my-score">0</div>
      </div>
      <div class="vs-badge" id="match-target-badge">ДО 5 ПОБЕД</div>
      <div class="score-box">
        <div class="score-title">БРАТ</div>
        <div class="score-val" id="enemy-score" style="color:#ff0044;">0</div>
      </div>
    </div>

    <div class="fire-zone">
      <button class="btn-fire" onclick="shoot()">
        💥 ОГОНЬ
        <span id="freq-info">Ультразвук: ---</span>
      </button>
    </div>

    <div class="panel-bottom" id="setup-panel">
      <div style="font-size: 13px; color: #aaa;">Твой код: <b id="my-id" style="color:#00ff42; font-size: 22px;">....</b></div>
      
      <div class="target-select">
        <button class="target-btn active" onclick="setMatchLimit(5, this)">ДО 5</button>
        <button class="target-btn" onclick="setMatchLimit(10, this)">ДО 10</button>
        <button class="target-btn" onclick="setMatchLimit(20, this)">ДО 20</button>
      </div>

      <input type="number" id="target-id" placeholder="1234" pattern="[0-9]*" inputmode="numeric">
      <button class="btn-connect" onclick="connectToBrother()">ПОДКЛЮЧИТЬСЯ</button>
      <div id="status" style="margin-top:8px; font-size:11px; color:#888;">Выбери цель по победам и введи код</div>
    </div>
  </div>

  <!-- Экран поражения в раунде -->
  <div id="round-dead-screen" class="game-screen">
    <h1>ТЫ ПОПАЛСЯ! ☠️</h1>
    <p id="round-dead-sub">Брат забрал этот раунд!</p>
    <button class="btn-action" onclick="nextRound()">СЛЕДУЮЩИЙ РАУНД</button>
  </div>

  <!-- Экран победы в раунде -->
  <div id="round-win-screen" class="game-screen">
    <h1>ТОЧНО В ЦЕЛЬ! 🎯</h1>
    <p id="round-win-sub">Очко в твою пользу!</p>
    <button class="btn-action" onclick="nextRound()">СЛЕДУЮЩИЙ РАУНД</button>
  </div>

  <!-- Экран завершения матча -->
  <div id="match-end-screen" class="game-screen">
    <h1 id="match-result-title">ПОБЕДА В МАТЧЕ! 🏆</h1>
    <p id="match-result-sub">Ты разгромил соперника!</p>
    <button class="btn-action" onclick="resetMatch()">НОВЫЙ МАТЧ</button>
  </div>

  <script>
    const myFourDigits = Math.floor(1000 + Math.random() * 9000).toString();
    
    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    };

    const peer = new Peer('lt-game-' + myFourDigits, peerConfig);

    let conn = null;
    let audioCtx = null;
    let analyser = null;

    // Настройки частот (Игрок 1 по умолчанию)
    let myTXFreq = 18500; // Частота выстрела
    let myRXFreq = 19500; // Частота приема
    
    let myScore = 0;
    let enemyScore = 0;
    let maxWins = 5;

    let isMutedSelf = false;
    let isRoundOver = false;

    document.getElementById('my-id').innerText = myFourDigits;

    function setMatchLimit(val, btn) {
      maxWins = val;
      document.querySelectorAll('.target-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('match-target-badge').innerText = `ДО ${maxWins} ПОБЕД`;
    }

    peer.on('connection', c => {
      conn = c;
      // Тот, кто принял подключение — Игрок 1
      myTXFreq = 18500;
      myRXFreq = 19500;
      document.getElementById('freq-info').innerText = "Передача: 18.5кГц | Прием: 19.5кГц";
      setupConnection();
    });

    async function connectToBrother() {
      await initAudio();
      const targetDigit = document.getElementById('target-id').value.trim();
      if (!targetDigit || targetDigit.length !== 4) return alert('Введи ровно 4 цифры!');
      
      document.getElementById('status').innerText = 'Поиск устройства...';
      conn = peer.connect('lt-game-' + targetDigit, { reliable: true });
      
      // Тот, кто инициировал подключение — Игрок 2 (зеркальные частоты)
      myTXFreq = 19500;
      myRXFreq = 18500;
      document.getElementById('freq-info').innerText = "Передача: 19.5кГц | Прием: 18.5кГц";
      setupConnection();
    }

    function setupConnection() {
      if (!conn) return;

      conn.on('open', () => {
        document.getElementById('status').innerText = '✅ ПОДКЛЮЧЕНО!';
        document.getElementById('status').style.color = '#00ff42';
        initAudio();

        // Синхронизируем лимит побед
        conn.send({ type: 'SYNC_LIMIT', limit: maxWins });
      });

      conn.on('data', data => {
        if (data.type === 'I_DIED') {
          if (!isRoundOver) handleRoundWin();
        } else if (data.type === 'NEXT_ROUND') {
          hideScreens();
        } else if (data.type === 'RESET_MATCH') {
          fullReset();
        } else if (data.type === 'SYNC_LIMIT') {
          maxWins = data.limit;
          document.getElementById('match-target-badge').innerText = `ДО ${maxWins} ПОБЕД`;
        }
      });
    }

    async function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      if (!analyser) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
          const source = audioCtx.createMediaStreamSource(stream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          source.connect(analyser);

          listenUltrasound();
        } catch (err) {
          console.error(err);
        }
      }
    }

    function listenUltrasound() {
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function check() {
        if (!isMutedSelf && !isRoundOver && analyser) {
          analyser.getByteFrequencyData(dataArray);
          
          const currentSampleRate = audioCtx.sampleRate;
          const centerIndex = Math.round((myRXFreq / (currentSampleRate / 2)) * bufferLength);
          
          // Сканируем диапазон (полоса пропускания ±3 ячейки)
          let maxSignal = 0;
          for (let i = centerIndex - 3; i <= centerIndex + 3; i++) {
            if (dataArray[i] && dataArray[i] > maxSignal) {
              maxSignal = dataArray[i];
            }
          }

          if (maxSignal > 50) {
            handleRoundLoss();
          }
        }
        requestAnimationFrame(check);
      }
      check();
    }

    async function shoot() {
      if (isRoundOver) return;
      await initAudio();
      
      isMutedSelf = true;
      setTimeout(() => { isMutedSelf = false; }, 450);

      if (navigator.vibrate) navigator.vibrate(50);

      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(myTXFreq, audioCtx.currentTime);

        gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch(e) {}
    }

    function handleRoundLoss() {
      if (isRoundOver) return;
      isRoundOver = true;

      enemyScore++;
      updateScoreUI();

      if (conn && conn.open) {
        conn.send({ type: 'I_DIED' });
      }

      if (enemyScore >= maxWins) {
        showMatchEnd(false);
      } else {
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        playLossSound();
        document.getElementById('round-dead-screen').style.display = 'flex';
      }
    }

    function handleRoundWin() {
      if (isRoundOver) return;
      isRoundOver = true;

      myScore++;
      updateScoreUI();

      if (myScore >= maxWins) {
        showMatchEnd(true);
      } else {
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        playWinSound();
        document.getElementById('round-win-screen').style.display = 'flex';
      }
    }

    function updateScoreUI() {
      document.getElementById('my-score').innerText = myScore;
      document.getElementById('enemy-score').innerText = enemyScore;
    }

    function showMatchEnd(isWinner) {
      const screen = document.getElementById('match-end-screen');
      const title = document.getElementById('match-result-title');
      const sub = document.getElementById('match-result-sub');

      if (isWinner) {
        title.innerText = "ПОБЕДА В МАТЧЕ! 🏆";
        title.style.color = "#00ff42";
        sub.innerText = `Ты первым набрал ${maxWins} побед!`;
        playWinSound();
      } else {
        title.innerText = "ПОРАЖЕНИЕ В МАТЧЕ ☠️";
        title.style.color = "#ff0044";
        sub.innerText = `Брат выиграл со счетом ${enemyScore}:${myScore}`;
        playLossSound();
      }
      screen.style.display = 'flex';
    }

    function nextRound() {
      hideScreens();
      if (conn && conn.open) {
        conn.send({ type: 'NEXT_ROUND' });
      }
    }

    function resetMatch() {
      fullReset();
      if (conn && conn.open) {
        conn.send({ type: 'RESET_MATCH' });
      }
    }

    function fullReset() {
      myScore = 0;
      enemyScore = 0;
      updateScoreUI();
      hideScreens();
    }

    function hideScreens() {
      isRoundOver = false;
      document.getElementById('round-dead-screen').style.display = 'none';
      document.getElementById('round-win-screen').style.display = 'none';
      document.getElementById('match-end-screen').style.display = 'none';
    }

    function playLossSound() {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch(e) {}
    }

    function playWinSound() {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(350, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch(e) {}
    }
  </script>
</body>
</html>
