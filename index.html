<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Shooter & Party</title>
  <style>
    :root {
      --bg: #0a0b10;
      --panel: #141622;
      --accent: #00ffcc;
      --accent-danger: #ff0055;
      --text: #ffffff;
      --text-dim: #8a8d9b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--panel);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }

    /* Верхняя панель: Код приглашения */
    .invite-card {
      background: rgba(255,255,255,0.03);
      border: 1px dashed var(--accent);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .invite-info {
      display: flex;
      flex-direction: column;
    }

    .invite-label {
      font-size: 12px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .invite-code {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent);
      letter-spacing: 2px;
    }

    .btn-secondary {
      background: rgba(0, 255, 204, 0.1);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: var(--accent);
      color: var(--bg);
    }

    /* Игровая арена */
    .game-zone {
      height: 220px;
      background: rgba(0,0,0,0.3);
      border-radius: 14px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.02);
    }

    .target {
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, var(--accent-danger) 0%, rgba(255,0,85,0.2) 70%);
      border: 3px solid var(--accent-danger);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 20px var(--accent-danger);
      transition: transform 0.05s ease;
      position: relative;
    }

    .target:active {
      transform: scale(0.92);
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: var(--text-dim);
    }

    .stat-val {
      color: var(--text);
      font-weight: bold;
    }

    /* Перегрев */
    .heat-container {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .heat-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-danger));
      transition: width 0.1s linear;
    }

    /* Главная кнопка выстрела */
    .btn-shoot {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #00ffcc 0%, #0099ff 100%);
      border: none;
      border-radius: 14px;
      color: var(--bg);
      font-size: 18px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 255, 204, 0.3);
      transition: all 0.1s;
    }

    .btn-shoot:active {
      transform: translateY(3px);
      box-shadow: 0 2px 10px rgba(0, 255, 204, 0.3);
    }

    .btn-shoot:disabled {
      background: #333645;
      color: #66697d;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Всплывающий урон */
    .damage-pop {
      position: absolute;
      color: var(--accent);
      font-weight: bold;
      font-size: 20px;
      pointer-events: none;
      animation: floatUp 0.6s forwards ease-out;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Блок приглашения -->
  <div class="invite-card">
    <div class="invite-info">
      <span class="invite-label">Код комнаты</span>
      <span class="invite-code" id="inviteCode">------</span>
    </div>
    <button class="btn-secondary" id="genInviteBtn">Создать код</button>
  </div>

  <!-- Статистика -->
  <div class="stats-bar">
    <div>Очки: <span class="stat-val" id="scoreVal">0</span></div>
    <div>Комбо: <span class="stat-val" id="comboVal">x1</span></div>
  </div>

  <!-- Индикатор перегрева оружия -->
  <div class="heat-container">
    <div class="heat-bar" id="heatBar"></div>
  </div>

  <!-- Арена с мишенью -->
  <div class="game-zone" id="gameZone">
    <div class="target" id="target"></div>
  </div>

  <!-- Главная кнопка -->
  <button class="btn-shoot" id="shootBtn">Стрелять 🔥</button>
</div>

<script>
  // --- АУДИО СИНТЕЗАТОР (Web Audio API) ---
  class SoundEffects {
    constructor() {
      this.ctx = null;
    }

    init() {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    playShoot() {
      this.init();
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.15);
      
      gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
      
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      
      osc.start();
      osc.stop(this.ctx.currentTime + 0.15);
    }

    playClick() {
      this.init();
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.08);
      
      gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
      
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      
      osc.start();
      osc.stop(this.ctx.currentTime + 0.08);
    }
  }

  const sounds = new SoundEffects();

  // --- СОСТОЯНИЕ ИГРЫ ---
  let score = 0;
  let combo = 1;
  let heat = 0;
  let isOverheated = false;
  let lastShotTime = Date.now();

  // DOM Элементы
  const shootBtn = document.getElementById('shootBtn');
  const target = document.getElementById('target');
  const gameZone = document.getElementById('gameZone');
  const scoreVal = document.getElementById('scoreVal');
  const comboVal = document.getElementById('comboVal');
  const heatBar = document.getElementById('heatBar');
  const inviteCodeEl = document.getElementById('inviteCode');
  const genInviteBtn = document.getElementById('genInviteBtn');

  // --- ЛОГИКА ВЫСТРЕЛА ---
  function executeShoot(e) {
    if (isOverheated) return;

    sounds.playShoot();

    // Расчет комбо (если выстрел сделан быстрей чем за 500мс)
    const now = Date.now();
    if (now - lastShotTime < 500) {
      combo = Math.min(combo + 1, 10);
    } else {
      combo = 1;
    }
    lastShotTime = now;

    // Очки
    const points = 10 * combo;
    score += points;

    // Нагрев пушки
    heat += 15;
    if (heat >= 100) {
      heat = 100;
      isOverheated = true;
      shootBtn.disabled = true;
      shootBtn.innerText = 'ПЕРЕГРЕВ! ❄️';
    }

    // Визуальный эффект выстрела (цифра)
    showDamagePop(points, e);

    // Обновление UI
    updateUI();
  }

  function showDamagePop(pts, e) {
    const pop = document.createElement('div');
    pop.className = 'damage-pop';
    pop.innerText = `+${pts}`;

    const rect = gameZone.getBoundingClientRect();
    let x = rect.width / 2;
    let y = rect.height / 2;

    if (e && e.clientX) {
      x = e.clientX - rect.left;
      y = e.clientY - rect.top;
    }

    pop.style.left = `${x}px`;
    pop.style.top = `${y}px`;

    gameZone.appendChild(pop);
    setTimeout(() => pop.remove(), 600);
  }

  // --- ОХЛАЖДЕНИЕ ОРУЖИЯ ---
  setInterval(() => {
    if (heat > 0) {
      heat -= isOverheated ? 10 : 5;
      if (heat <= 0) {
        heat = 0;
        if (isOverheated) {
          isOverheated = false;
          shootBtn.disabled = false;
          shootBtn.innerText = 'Стрелять 🔥';
        }
      }
      updateUI();
    }
  }, 100);

  function updateUI() {
    scoreVal.innerText = score;
    comboVal.innerText = `x${combo}`;
    heatBar.style.width = `${heat}%`;
  }

  // --- ГЕНЕРАТОР КОДА ПРИГЛАШЕНИЯ ---
  function generateInviteCode() {
    sounds.playClick();
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = 'SKW-';
    for (let i = 0; i < 4; i++) {
      code += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    inviteCodeEl.innerText = code;
    
    // Копирование в буфер обмена
    navigator.clipboard.writeText(code).then(() => {
      const origText = genInviteBtn.innerText;
      genInviteBtn.innerText = 'Скопировано!';
      setTimeout(() => genInviteBtn.innerText = origText, 1500);
    }).catch(() => {});
  }

  // СЛУШАТЕЛИ СОБЫТИЙ
  shootBtn.addEventListener('click', (e) => executeShoot(e));
  target.addEventListener('click', (e) => executeShoot(e));
  genInviteBtn.addEventListener('click', generateInviteCode);

  // Старт: генерируем базовый код
  generateInviteCode();
</script>
</body>
</html>
