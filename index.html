<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ultrasound Dual-Freq LaserTag</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #08080c; color: #fff; }

    .gun-interface {
      position: absolute; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 20px; background: radial-gradient(circle at center, #151520 0%, #050508 100%);
    }

    .btn-fire-left {
      position: absolute; top: 15px; left: 15px;
      background: linear-gradient(135deg, #ff0044, #990022);
      color: #fff; font-size: 20px; font-weight: bold;
      padding: 20px 30px; border-radius: 16px;
      border: 2px solid #fff; box-shadow: 0 0 20px rgba(255, 0, 68, 0.8);
      cursor: pointer;
    }
    .btn-fire-left:active { transform: scale(0.92); background: #ff3366; }

    .role-badge {
      position: absolute; top: 15px; right: 15px;
      font-size: 11px; color: #00ff42; letter-spacing: 1px;
      border: 1px solid #00ff42; padding: 6px 10px; border-radius: 6px;
      background: rgba(0,255,66,0.1); font-weight: bold; text-align: right;
    }

    .panel-bottom {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(20, 20, 30, 0.95); padding: 16px; border-radius: 16px;
      text-align: center; width: 90%; max-width: 340px; border: 1px solid #333;
    }

    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; text-align: center; font-size: 16px; background: #111; color: #fff; text-transform: uppercase; }
    button.btn-connect { background: #00ff42; color: #000; font-weight: bold; padding: 12px; border: none; border-radius: 8px; width: 100%; font-size: 16px; cursor: pointer; }

    #dead-screen {
      position: absolute; z-index: 100; width: 100%; height: 100%; background: #c80000;
      display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center;
    }
    #dead-screen h1 { font-size: 46px; text-shadow: 0 0 10px #000; }
  </style>
</head>
<body>

  <div class="gun-interface">
    <button class="btn-fire-left" onclick="shoot()">💥 ОГОНЬ</button>
    <div class="role-badge" id="role-info">РЕЖИМ: НЕ ПОДКЛЮЧЕНО</div>

    <div class="panel-bottom" id="setup-panel">
      <div style="font-size: 14px; color: #aaa;">Твой ID: <b id="my-id" style="color:#00ff42; font-size: 18px;">...</b></div>
      <input type="text" id="target-id" placeholder="ВВЕДИ ID БРАТА">
      <button class="btn-connect" onclick="connectToBrother()">ПОДКЛЮЧИТЬСЯ</button>
      <div id="status" style="margin-top:8px; font-size:12px; color:#888;">Введи ID или жди подключения</div>
    </div>
  </div>

  <div id="dead-screen">
    <h1>ТЫ УБИТ! ☠️</h1>
    <p style="margin-top: 10px; font-size: 18px;">Тебя накрыл ультразвук брата</p>
    <button onclick="respawn()" style="margin-top:30px; padding: 14px 32px; background:#fff; color:#000; font-size: 18px; font-weight:bold; border-radius:10px; border:none;">ВОЗРОДИТЬСЯ</button>
  </div>

  <script>
    let peer = new Peer();
    let conn = null;
    let audioCtx = null;
    let analyser = null;
    let isHost = false;

    // Частоты:
    // Игрок 1 (Host): Стреляет 18000 Гц, Слушает 19000 Гц
    // Игрок 2 (Client): Стреляет 19000 Гц, Слушает 18000 Гц
    let myTXFreq = 18000; 
    let myRXFreq = 19000;
    let isMutedSelf = false;

    peer.on('open', id => { 
      document.getElementById('my-id').innerText = id.slice(0, 5); 
    });

    // Когда к нам подключаются (мы Host)
    peer.on('connection', c => {
      conn = c;
      isHost = true;
      myTXFreq = 18000;
      myRXFreq = 19000;
      updateRoleUI("ИГРОК 1 (18кГц)");
      setupConnection();
    });

    // Когда мы подключаемся (мы Client)
    function connectToBrother() {
      initAudio();
      const targetId = document.getElementById('target-id').value.trim();
      if (!targetId) return alert('Введи ID!');
      
      conn = peer.connect(targetId);
      isHost = false;
      myTXFreq = 19000;
      myRXFreq = 18000;
      updateRoleUI("ИГРОК 2 (19кГц)");
      setupConnection();
    }

    function updateRoleUI(text) {
      document.getElementById('role-info').innerText = "РЕЖИМ: " + text;
    }

    function setupConnection() {
      conn.on('open', () => {
        document.getElementById('status').innerText = '✅ ПОДКЛЮЧЕНО К БРАТУ!';
        document.getElementById('status').style.color = '#00ff42';
        initAudio();
      });

      conn.on('data', data => {
        if (data.type === 'HIT') die();
      });
    }

    // Микрофон
    async function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } });
        const source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);

        listenUltrasound();
      } catch (err) {
        alert('Разреши доступ к микрофону!');
      }
    }

    // Слушаем ТОЛЬКО частоту врага
    function listenUltrasound() {
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function check() {
        if (!isMutedSelf && analyser) {
          analyser.getByteFrequencyData(dataArray);
          
          // Рассчитываем индекс нужной частоты врага
          const targetIndex = Math.round((myRXFreq / (audioCtx.sampleRate / 2)) * bufferLength);
          
          // Проверяем соседние бины для надежности (±1 бин)
          const val1 = dataArray[targetIndex - 1] || 0;
          const val2 = dataArray[targetIndex] || 0;
          const val3 = dataArray[targetIndex + 1] || 0;
          const maxSignal = Math.max(val1, val2, val3);

          // Если прилетел вражеский импульс громче порога (80)
          if (maxSignal > 80) {
            if (conn && conn.open) {
              conn.send({ type: 'HIT' });
            }
            die();
          }
        }
        requestAnimationFrame(check);
      }
      check();
    }

    // ВЫСТРЕЛ
    function shoot() {
      if (!audioCtx) initAudio();
      
      // Включаем временную задержку, чтобы свой микрофон вообще не слушал
      isMutedSelf = true;
      setTimeout(() => { isMutedSelf = false; }, 400);

      playShotSound();
      if (navigator.vibrate) navigator.vibrate(80);

      // Излучаем УЛЬТРАЗВУК
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(myTXFreq, audioCtx.currentTime);

        gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch(e) {}
    }

    function die() {
      if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 500]);
      playExplosionSound();
      document.getElementById('dead-screen').style.display = 'flex';
    }

    function respawn() {
      document.getElementById('dead-screen').style.display = 'none';
    }

    function playShotSound() {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch(e) {}
    }

    function playExplosionSound() {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch(e) {}
    }
  </script>
</body>
</html>
