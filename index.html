<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Laser Squad</title>
  <style>
    :root {
      --bg: #090a10;
      --panel: #121420;
      --accent: #00ffcc;
      --ammo: #ffcc00;
      --danger: #ff0055;
      --text: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }

    .app {
      width: 100%; max-width: 420px; background: var(--panel); border-radius: 20px; padding: 20px;
      border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 30px #000;
    }

    /* Верхняя панель: Комната */
    .room-bar {
      background: rgba(255,255,255,0.03); border: 1px dashed var(--accent); border-radius: 12px; padding: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .room-code { font-size: 18px; font-weight: bold; color: var(--accent); letter-spacing: 2px; }
    .btn-sm { background: var(--accent); color: #000; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* Экран игры */
    .arena {
      height: 180px; background: rgba(0,0,0,0.4); border-radius: 14px; position: relative;
      display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid rgba(255,255,255,0.05);
    }
    
    .target-shield {
      width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--accent);
      display: flex; justify-content: center; align-items: center; font-weight: bold;
      box-shadow: 0 0 15px var(--accent); transition: transform 0.05s;
    }
    .target-shield:active { transform: scale(0.9); }

    /* Патроны и перезарядка */
    .ammo-box { display: flex; justify-content: space-between; align-items: center; }
    .bullets { display: flex; gap: 4px; }
    .bullet { width: 8px; height: 20px; background: var(--ammo); border-radius: 2px; }
    .bullet.empty { background: rgba(255,255,255,0.1); }

    /* Кнопки управления */
    .controls { display: flex; gap: 10px; }
    .btn-shoot {
      flex: 2; padding: 16px; background: linear-gradient(135deg, #00ffcc, #0088ff); border: none;
      border-radius: 12px; color: #000; font-size: 18px; font-weight: 900; cursor: pointer; text-transform: uppercase;
    }
    .btn-shoot:disabled { background: #333; color: #777; }
    .btn-reload {
      flex: 1; padding: 16px; background: rgba(255,204,0,0.15); border: 1px solid var(--ammo);
      border-radius: 12px; color: var(--ammo); font-size: 14px; font-weight: bold; cursor: pointer;
    }

    /* Переключатель Ультразвук/Микрофон */
    .sensor-box {
      background: rgba(255,255,255,0.02); padding: 10px; border-radius: 8px; font-size: 12px;
      display: flex; justify-content: space-between; align-items: center; color: #aaa;
    }
  </style>
</head>
<body>

<div class="app">
  <!-- Комната -->
  <div class="room-bar">
    <div>
      <div style="font-size: 10px; color: #aaa;">КОД ГРУППЫ</div>
      <div class="room-code" id="roomCode">SQD-88</div>
    </div>
    <button class="btn-sm" id="joinBtn">Создать/Войти</button>
  </div>

  <!-- Арена -->
  <div class="arena">
    <div class="target-shield" id="target">
      <span id="shieldVal">100%</span>
    </div>
    <div style="position: absolute; bottom: 8px; font-size: 12px; color: #888;">
      Игроков в сети: <b style="color:#fff" id="playersCount">1</b>
    </div>
  </div>

  <!-- Патроны -->
  <div class="ammo-box">
    <div class="bullets" id="bulletsContainer"></div>
    <div style="font-size: 14px;"><b id="ammoText">10</b> / 10</div>
  </div>

  <!-- Кнопки -->
  <div class="controls">
    <button class="btn-shoot" id="shootBtn">СТРЕЛЯТЬ 🔥</button>
    <button class="btn-reload" id="reloadBtn">🔄 🚀</button>
  </div>

  <!-- Микрофон/Ультразвук -->
  <div class="sensor-box">
    <span>Сканер импульсов (Второй планшет)</span>
    <button class="btn-sm" id="micBtn" style="background: #333; color: #fff;">Включить микрофон</button>
  </div>
</div>

<script>
  // --- НАСТРОЙКИ ПАТРОНОВ И ИГРЫ ---
  const MAX_AMMO = 10;
  let currentAmmo = MAX_AMMO;
  let isReloading = false;
  let shield = 100;

  const shootBtn = document.getElementById('shootBtn');
  const reloadBtn = document.getElementById('reloadBtn');
  const bulletsContainer = document.getElementById('bulletsContainer');
  const ammoText = document.getElementById('ammoText');
  const shieldVal = document.getElementById('shieldVal');
  const target = document.getElementById('target');

  // --- AUDIO SYNTHESIZER ---
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  // Звук Выстрела + Высокочастотный "Ультразвуковой" импульс (17.5 кГц)
  function playUltraShootSound() {
    initAudio();

    // 1. Слышимый звук клика/выстрела
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);

    // 2. Высокочастотный сигнал (для второго планшета)
    const ultraOsc = audioCtx.createOscillator();
    const ultraGain = audioCtx.createGain();
    ultraOsc.type = 'sine';
    ultraOsc.frequency.setValueAtTime(17500, audioCtx.currentTime); // ~17.5 кГц
    ultraGain.gain.setValueAtTime(0.8, audioCtx.currentTime);
    ultraGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
    ultraOsc.connect(ultraGain);
    ultraGain.connect(audioCtx.destination);
    ultraOsc.start();
    ultraOsc.stop(audioCtx.currentTime + 0.08);
  }

  // Звук перезарядки
  function playReloadSound() {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  }

  // --- ОТОБРАЖЕНИЕ ПАТРОНОВ ---
  function renderAmmo() {
    bulletsContainer.innerHTML = '';
    for (let i = 0; i < MAX_AMMO; i++) {
      const b = document.createElement('div');
      b.className = `bullet ${i < currentAmmo ? '' : 'empty'}`;
      bulletsContainer.appendChild(b);
    }
    ammoText.innerText = currentAmmo;
  }

  // --- ВЫСТРЕЛ ---
  function shoot() {
    if (isReloading) return;
    if (currentAmmo <= 0) {
      reload();
      return;
    }

    currentAmmo--;
    renderAmmo();
    playUltraShootSound();

    // Урон по щиту
    shield = Math.max(0, shield - 10);
    shieldVal.innerText = `${shield}%`;
    if (shield === 0) {
      target.style.borderColor = '#ff0055';
      setTimeout(() => { shield = 100; shieldVal.innerText = '100%'; target.style.borderColor = 'var(--accent)'; }, 1000);
    }

    if (currentAmmo === 0) {
      shootBtn.disabled = true;
      shootBtn.innerText = 'НЕТ ПАТРОНОВ!';
    }
  }

  // --- ПЕРЕЗАРЯДКА ---
  function reload() {
    if (isReloading || currentAmmo === MAX_AMMO) return;
    isReloading = true;
    shootBtn.disabled = true;
    shootBtn.innerText = 'ПЕРЕЗАРЯДКА...';
    playReloadSound();

    setTimeout(() => {
      currentAmmo = MAX_AMMO;
      isReloading = false;
      shootBtn.disabled = false;
      shootBtn.innerText = 'СТРЕЛЯТЬ 🔥';
      renderAmmo();
    }, 1200); // 1.2 секунды перезарядка
  }

  // --- СКАНЕР МИКРОФОНА (ДЛЯ ВТОРОГО ПЛАНШЕТА) ---
  let micActive = false;
  document.getElementById('micBtn').addEventListener('click', async function() {
    initAudio();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const micSource = audioCtx.createMediaStreamSource(stream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      micSource.connect(analyser);

      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      this.innerText = "Сканер Активен 📡";
      this.style.background = "var(--accent)";
      this.style.color = "#000";

      // Постоянная проверка ультразвуковых частот (~17.5кГц)
      function detectSignal() {
        analyser.getByteFrequencyData(dataArray);
        // Смотрим верхние частотные бины
        let highFreqVolume = dataArray[200]; // Высокий диапазон
        if (highFreqVolume > 180) { // Порог срабатывания
          shield = Math.max(0, shield - 10);
          shieldVal.innerText = `${shield}%`;
        }
        requestAnimationFrame(detectSignal);
      }
      detectSignal();
    } catch(err) {
      alert("Нужен доступ к микрофону, чтобы ловить выстрелы другого планшета!");
    }
  });

  // ИНИЦИАЛИЗАЦИЯ
  shootBtn.addEventListener('click', shoot);
  reloadBtn.addEventListener('click', reload);
  renderAmmo();
</script>
</body>
</html>
