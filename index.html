<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ultrasound LaserTag</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #08080c; color: #fff; }

    .gun-interface {
      position: absolute; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 20px; background: radial-gradient(circle at center, #151520 0%, #050508 100%);
    }

    .aim-indicator {
      position: absolute; top: 15px; right: 15px;
      font-size: 11px; color: #00ff42; letter-spacing: 1px;
      border: 1px solid #00ff42; padding: 6px 10px; border-radius: 6px;
      background: rgba(0,255,66,0.1); font-weight: bold;
    }

    .btn-fire-left {
      position: absolute; top: 15px; left: 15px;
      background: linear-gradient(135deg, #ff0044, #990022);
      color: #fff; font-size: 20px; font-weight: bold;
      padding: 20px 30px; border-radius: 16px;
      border: 2px solid #fff; box-shadow: 0 0 20px rgba(255, 0, 68, 0.8);
      cursor: pointer;
    }
    .btn-fire-left:active { transform: scale(0.92); background: #ff3366; }

    .panel-bottom {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(20, 20, 30, 0.95); padding: 16px; border-radius: 16px;
      text-align: center; width: 90%; max-width: 340px; border: 1px solid #333;
    }

    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; text-align: center; font-size: 16px; background: #111; color: #fff; text-transform: uppercase; }
    button.btn-connect { background: #00ff42; color: #000; font-weight: bold; padding: 12px; border: none; border-radius: 8px; width: 100%; font-size: 16px; cursor: pointer; }

    #dead-screen {
      position: absolute; z-index: 100; width: 100%; height: 100%; background: #c80000;
      display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center;
    }
    #dead-screen h1 { font-size: 46px; text-shadow: 0 0 10px #000; }
  </style>
</head>
<body>

  <div class="gun-interface">
    <button class="btn-fire-left" onclick="shoot()">💥 ОГОНЬ</button>
    <div class="aim-indicator">🔊 УЛЬТРАЗВУК АКТИВЕН</div>

    <div class="panel-bottom" id="setup-panel">
      <div style="font-size: 14px; color: #aaa;">Твой ID: <b id="my-id" style="color:#00ff42; font-size: 18px;">...</b></div>
      <input type="text" id="target-id" placeholder="ВВЕДИ ID БРАТА">
      <button class="btn-connect" onclick="connectToBrother()">ПОДКЛЮЧИТЬСЯ</button>
      <div id="status" style="margin-top:8px; font-size:12px; color:#888;">Нажми «Подключиться» для старта</div>
    </div>
  </div>

  <div id="dead-screen">
    <h1>ТЫ УБИТ! ☠️</h1>
    <p style="margin-top: 10px; font-size: 18px;">Тебя накрыло ультразвуком</p>
    <button onclick="respawn()" style="margin-top:30px; padding: 14px 32px; background:#fff; color:#000; font-size: 18px; font-weight:bold; border-radius:10px; border:none;">ВОЗРОДИТЬСЯ</button>
  </div>

  <script>
    let peer = new Peer();
    let conn = null;
    let audioCtx = null;
    let micStream = null;
    let analyser = null;
    const US_FREQ = 19500; // Частота ультразвука (19.5 кГц)

    peer.on('open', id => { document.getElementById('my-id').innerText = id.slice(0, 5); });

    peer.on('connection', c => {
      conn = c;
      setupConnection();
    });

    function connectToBrother() {
      initAudio();
      const targetId = document.getElementById('target-id').value.trim();
      if (!targetId) return alert('Введи ID!');
      conn = peer.connect(targetId);
      setupConnection();
    }

    function setupConnection() {
      conn.on('open', () => {
        document.getElementById('status').innerText = '✅ ПОДКЛЮЧЕНО К БРАТУ!';
        document.getElementById('status').style.color = '#00ff42';
      });

      conn.on('data', data => {
        if (data.type === 'HIT') die();
      });
    }

    // Инициализация микрофона и анализатора ультразвука
    async function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        const source = audioCtx.createMediaStreamSource(micStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);

        // Постоянно слушаем микрофон на предмет ультразвука
        listenUltrasound();
      } catch (err) {
        alert('Нужен доступ к микрофону для считывания ультразвука!');
      }
    }

    // Прослушивание частоты 19.5 кГц
    function listenUltrasound() {
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function check() {
        analyser.getByteFrequencyData(dataArray);
        
        // Переводим 19.5 кГц в индекс массива FFT
        const index = Math.round((US_FREQ / (audioCtx.sampleRate / 2)) * bufferLength);
        const signalStrength = dataArray[index];

        // Если прилетел мощный ультразвуковой импульс (> 140)
        if (signalStrength > 140) {
          if (conn && conn.open) {
            conn.send({ type: 'HIT' });
          }
          die();
        }
        requestAnimationFrame(check);
      }
      check();
    }

    // Выстрел ультразвуковым импульсом
    function shoot() {
      if (!audioCtx) initAudio();
      
      playShotSound();
      if (navigator.vibrate) navigator.vibrate(80);

      // Генерация не слышимого ухом ультразвукового сигнала (19.5 кГц)
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(US_FREQ, audioCtx.currentTime);

        gain.gain.setValueAtTime(1.0, audioCtx.currentTime); // Максимальная мощность
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch(e) {}
    }

    function die() {
      if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 500]);
      playExplosionSound();
      document.getElementById('dead-screen').style.display = 'flex';
    }

    function respawn() {
      document.getElementById('dead-screen').style.display = 'none';
    }

    // Звуковой эффект выстрела (для игрока)
    function playShotSound() {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch(e) {}
    }

    function playExplosionSound() {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.4);

        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch(e) {}
    }
  </script>
</body>
</html>
